name: Build NetHunter Kernel for Xperia XZ2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: System-Abhängigkeiten installieren
        run: |
          sudo apt update
          sudo apt install -y build-essential bc libncurses5-dev libssl-dev bison flex \
                                 git libelf-dev libgnutls28-dev gcc-aarch64-linux-gnu \
                                 g++-aarch64-linux-gnu ccache zip

      - name: LineageOS Kernel-Source klonen
        run: |
          git clone https://github.com/LineageOS/android_kernel_sony_sdm845.git -b lineage-20 kernel

      - name: NetHunter-Konfigurationen injecten
        run: |
          cd kernel
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- make akari_defconfig

          cat <<EOF >> .config
          CONFIG_CFG80211=y
          CONFIG_MAC80211=y
          CONFIG_CFG80211_WEXT=y
          CONFIG_USB_CONFIGFS=y
          CONFIG_USB_CONFIGFS_F_HID=y
          CONFIG_USB_G_HID=y
          CONFIG_USB_USBNET=y
          CONFIG_USB_NET_CDCETHER=y
          CONFIG_BT_HCIBTUSB=y
          CONFIG_RTL8812AU=m
          CONFIG_RTL8188EUS=m
          CONFIG_ATH9K_HTC=m
          EOF

          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- make olddefconfig

      - name: Kernel kompilieren
        run: |
          cd kernel
          ARCH=arm64 CROSS_COMPILE=aarch64-linux-gnu- make -j$(nproc) Image.gz-dtb

      - name: AnyKernel3 paketieren
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AK3
          cp kernel/arch/arm64/boot/Image.gz-dtb AK3/
          cd AK3
          zip -r9 NetHunter-Kernel-akari.zip * -x .git README.md

      - name: Kernel als Download-Artefakt bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-akari
          path: AK3/NetHunter-Kernel-akari.zip
